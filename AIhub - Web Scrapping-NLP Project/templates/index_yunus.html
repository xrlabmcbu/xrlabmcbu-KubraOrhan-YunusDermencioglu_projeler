<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje Tanıtımı</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Renk geçişi animasyonu tanımlanır */
        @keyframes backgroundColorChange {
            0% {
                background-color: #e0e7ff;
                /* Açık mavi */
            }

            50% {
                background-color: #a2c2e6;
                /* Daha koyu mavi */
            }

            100% {
                background-color: #e0e7ff;
                /* Açık mavi */
            }
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: backgroundColorChange 10s infinite;
            /* Renk geçişi animasyonunu uygula */
        }

        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
        }

        .header h1 {
            font-size: 3rem;
            margin: 0;
        }

        .content {
            position: relative;
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            /* Yatay hizalama */
            text-align: center;
            margin-top: -100px;
            /* VisionDrive ve AIHub yazılarını yukarı taşır */
        }

        .logo-container {
            position: relative;
            width: 45%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            /* Yazılar ve butonlar arasındaki boşluk */
        }

        .buttons {
            margin-top: 1rem;
            /* Yazılar ve butonlar arasındaki boşluk */
        }

        .btn {
            margin: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            text-decoration: none;
        }

        .authors {
            position: absolute;
            bottom: 50px;
            /* Ekranın altına yakın konum */
            text-align: center;
        }

        .authors h2 {
            margin: 0.5rem 0;
            font-size: 1.5rem;
        }

        .authors img {
            margin-top: -10px;
            max-width: 200px;
            /* Logonun genişliğini ayarlayın */
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>PROJELERİMİZ</h1>
    </div>
    <div class="content">
        <div class="logo-container">
            <div class="logo">VisionDrive</div>
            <div class="buttons">
                <a href="visiondrive" class="btn">VisionDrive Hakkında</a>
            </div>
        </div>
        <div class="logo-container">
            <div class="logo">AIHub</div>
            <div class="buttons">
                <a href="aihub" class="btn">AIHub Hakkında</a>
            </div>
        </div>
    </div>
    <div class="authors">
        <h2>Hatice Kübra Orhan</h2>
        <h2>Yunus Dermencioğlu</h2>
        <img src="/NLP/templates/xrlabcbu_logo.png" alt="XRLAB Logo">

    </div>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>

</html>
